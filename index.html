<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSim Token Counter</title>
    <style>
        body {
            font-family: 'Cal Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            color: #333;
            line-height: 1.6;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.02em;
        }
        
        .header p {
            margin: 10px 0 0 0;
            color: #666;
            font-size: 1.1rem;
        }
        
        .search-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        
        .button:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        
        .results {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            padding: 24px;
            margin-top: 20px;
        }
        
        .project-info {
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        
        .project-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: #1a1a1a;
        }
        
        .project-meta {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .token-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .token-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        
        .token-number {
            font-size: 2rem;
            font-weight: 700;
            color: #3b82f6;
            display: block;
        }
        
        .token-label {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 4px;
        }
        
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .note {
            background: #fffbeb;
            border: 1px solid #fed7aa;
            color: #92400e;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>WebSim Token Counter</h1>
        <p>Analyze token usage for WebSim projects</p>
    </div>
    
    <div class="search-section">
        <div class="input-group">
            <label for="projectId">Project ID</label>
            <input type="text" id="projectId" placeholder="e.g., abc123xyz789" />
        </div>
        
        <button class="button" onclick="analyzeProject()">
            Analyze Project
        </button>
    </div>
    
    <div id="results"></div>
    
    <div class="note">
        <strong>Note:</strong> This tool estimates token counts based on available project data. The WebSim API doesn't directly expose token count metadata, so we calculate approximate values based on prompt text, HTML content, and other available information.
    </div>

    <script>
        let currentProject = null;
        
        async function analyzeProject() {
            const projectId = document.getElementById('projectId').value.trim();
            if (!projectId) {
                showError('Please enter a project ID');
                return;
            }
            
            showLoading();
            
            try {
                // Fetch project data
                const projectResponse = await fetch(`/api/v1/projects/${projectId}`);
                if (!projectResponse.ok) {
                    throw new Error(`Project not found (${projectResponse.status})`);
                }
                
                const projectData = await projectResponse.json();
                currentProject = projectData;
                
                // Fetch HTML content if available
                let htmlContent = '';
                if (projectData.site && projectData.project_revision) {
                    try {
                        const htmlResponse = await fetch(`/api/v1/projects/${projectId}/revisions/${projectData.project_revision.version}/html`);
                        if (htmlResponse.ok) {
                            htmlContent = await htmlResponse.text();
                        }
                    } catch (e) {
                        console.warn('Could not fetch HTML content:', e);
                    }
                }
                
                // Fetch all project assets (JS, CSS, etc.)
                let assets = [];
                let assetContents = {};
                if (projectData.project_revision) {
                    try {
                        const assetsResponse = await fetch(`/api/v1/projects/${projectId}/revisions/${projectData.project_revision.version}/assets`);
                        if (assetsResponse.ok) {
                            const assetsData = await assetsResponse.json();
                            assets = assetsData.assets || [];
                            
                            // Fetch content for each asset
                            for (const asset of assets) {
                                try {
                                    const contentResponse = await fetch(`/api/v1/projects/${projectId}/revisions/${projectData.project_revision.version}/assets/${encodeURIComponent(asset.path)}/content`);
                                    if (contentResponse.ok) {
                                        const contentData = await contentResponse.json();
                                        assetContents[asset.path] = contentData.content;
                                    }
                                } catch (e) {
                                    console.warn(`Could not fetch content for asset ${asset.path}:`, e);
                                }
                            }
                        }
                    } catch (e) {
                        console.warn('Could not fetch assets:', e);
                    }
                }
                
                // Calculate token estimates
                const tokenAnalysis = calculateTokens(projectData, htmlContent, assets, assetContents);
                displayResults(projectData, tokenAnalysis, assets);
                
            } catch (error) {
                showError(error.message);
            }
        }
        
        function calculateTokens(projectData, htmlContent, assets, assetContents) {
            // More accurate token estimation using word-based counting for different content types
            const estimateTokens = (text, contentType = 'text') => {
                if (!text) return 0;
                
                // Clean the text
                const cleanText = text.trim();
                if (!cleanText) return 0;
                
                if (contentType === 'code' || contentType === 'html') {
                    // For code content, count more accurately by considering syntax
                    // Code typically has shorter tokens due to symbols and keywords
                    const words = cleanText.split(/\s+/);
                    const symbols = (cleanText.match(/[{}();.,=<>\/\-+*&|!@#$%^]/g) || []).length;
                    return Math.ceil(words.length * 0.8 + symbols * 0.3);
                } else {
                    // For regular text, use GPT-style estimation (roughly 0.75 tokens per word)
                    const words = cleanText.split(/\s+/).filter(word => word.length > 0);
                    return Math.ceil(words.length * 0.75);
                }
            };
            
            const analysis = {
                prompt: 0,
                html: 0,
                title: 0,
                description: 0,
                javascript: 0,
                css: 0,
                json: 0,
                text: 0,
                other: 0,
                lore: 0,
                metadata: 0,
                total: 0,
                assetBreakdown: {}
            };
            
            // Analyze prompt if available
            if (projectData.site?.prompt?.text) {
                analysis.prompt = estimateTokens(projectData.site.prompt.text);
            }
            
            // Analyze lore data if available (this contains context and features)
            if (projectData.site?.lore) {
                const loreText = JSON.stringify(projectData.site.lore);
                analysis.lore = estimateTokens(loreText, 'code');
            }
            
            // Analyze HTML content
            if (htmlContent) {
                analysis.html = estimateTokens(htmlContent, 'html');
            }
            
            // Analyze title and description
            if (projectData.project?.title) {
                analysis.title = estimateTokens(projectData.project.title);
            }
            
            if (projectData.project?.description) {
                analysis.description = estimateTokens(projectData.project.description);
            }
            
            // Analyze project metadata that might be sent to AI
            const metadataFields = [
                projectData.site?.title,
                projectData.site?.yapping,
                projectData.project?.slug
            ].filter(Boolean);
            
            if (metadataFields.length > 0) {
                analysis.metadata = estimateTokens(metadataFields.join(' '));
            }
            
            // Analyze assets by type with more accurate categorization
            for (const asset of assets) {
                const content = assetContents[asset.path] || '';
                const contentType = asset.content_type?.toLowerCase() || '';
                const path = asset.path.toLowerCase();
                
                let tokens = 0;
                let category = 'other';
                
                // Determine content type and calculate tokens accordingly
                if (contentType.includes('javascript') || path.endsWith('.js') || path.endsWith('.mjs')) {
                    tokens = estimateTokens(content, 'code');
                    category = 'javascript';
                } else if (contentType.includes('css') || path.endsWith('.css')) {
                    tokens = estimateTokens(content, 'code');
                    category = 'css';
                } else if (contentType.includes('json') || path.endsWith('.json')) {
                    tokens = estimateTokens(content, 'code');
                    category = 'json';
                } else if (contentType.includes('text') || path.endsWith('.txt') || path.endsWith('.md')) {
                    tokens = estimateTokens(content);
                    category = 'text';
                } else if (contentType.includes('html') || path.endsWith('.html')) {
                    tokens = estimateTokens(content, 'html');
                    category = 'other';
                } else {
                    // For binary files or unknown types, estimate based on size
                    // Assume some compression ratio for binary content
                    tokens = Math.ceil(asset.size / 8); // Very rough estimate for binary
                    category = 'other';
                }
                
                // Include asset metadata (title, description) if available
                let assetMetadataTokens = 0;
                if (asset.meta?.title) {
                    assetMetadataTokens += estimateTokens(asset.meta.title);
                }
                if (asset.meta?.description) {
                    assetMetadataTokens += estimateTokens(asset.meta.description);
                }
                
                const totalAssetTokens = tokens + assetMetadataTokens;
                
                analysis.assetBreakdown[asset.path] = {
                    tokens: totalAssetTokens,
                    contentTokens: tokens,
                    metadataTokens: assetMetadataTokens,
                    contentType: asset.content_type,
                    size: asset.size,
                    category
                };
                
                analysis[category] += totalAssetTokens;
            }
            
            analysis.total = analysis.prompt + analysis.html + analysis.title + analysis.description + 
                           analysis.javascript + analysis.css + analysis.json + analysis.text + 
                           analysis.other + analysis.lore + analysis.metadata;
            
            return analysis;
        }
        
        function displayResults(projectData, tokenAnalysis, assets) {
            const resultsDiv = document.getElementById('results');
            
            const project = projectData.project;
            const site = projectData.site;
            const revision = projectData.project_revision;
            
            // Create asset breakdown HTML with better categorization
            let assetBreakdownHtml = '';
            if (assets.length > 0) {
                const categories = {};
                Object.entries(tokenAnalysis.assetBreakdown).forEach(([path, data]) => {
                    if (!categories[data.category]) {
                        categories[data.category] = [];
                    }
                    categories[data.category].push({ path, ...data });
                });
                
                assetBreakdownHtml = `
                    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
                        <h3 style="margin: 0 0 16px 0; font-size: 1.2rem; color: #374151;">Asset Breakdown by Category</h3>
                        ${Object.entries(categories).map(([category, files]) => `
                            <div style="margin-bottom: 20px;">
                                <h4 style="margin: 0 0 8px 0; font-size: 1rem; color: #4b5563; text-transform: capitalize;">${category} Files (${files.reduce((sum, f) => sum + f.tokens, 0)} tokens)</h4>
                                <div style="display: grid; gap: 6px;">
                                    ${files.map(file => `
                                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: #f9fafb; border-radius: 6px; font-size: 0.85rem;">
                                            <span style="font-family: 'Space Mono', monospace; color: #374151;">${file.path}</span>
                                            <div style="display: flex; gap: 12px; align-items: center;">
                                                <span style="color: #6b7280; font-size: 0.75rem;">${(file.size / 1024).toFixed(1)}KB</span>
                                                ${file.metadataTokens > 0 ? `<span style="color: #f59e0b; font-size: 0.75rem;">+${file.metadataTokens} meta</span>` : ''}
                                                <span style="color: #3b82f6; font-weight: 600;">${file.tokens} tokens</span>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            resultsDiv.innerHTML = `
                <div class="results">
                    <div class="project-info">
                        <h2 class="project-title">${project.title || 'Untitled Project'}</h2>
                        <div class="project-meta">
                            Project ID: ${project.id} | 
                            Version: ${revision?.version || 'N/A'} | 
                            Created: ${new Date(project.created_at).toLocaleDateString()} |
                            Views: ${project.stats?.views || 0} |
                            Assets: ${assets.length}
                        </div>
                        ${project.description ? `<p style="margin-top: 12px; color: #4b5563;">${project.description}</p>` : ''}
                    </div>
                    
                    <div class="token-info">
                        <div class="token-card">
                            <span class="token-number">${tokenAnalysis.prompt}</span>
                            <div class="token-label">Prompt Tokens</div>
                        </div>
                        
                        <div class="token-card">
                            <span class="token-number">${tokenAnalysis.html}</span>
                            <div class="token-label">HTML Content</div>
                        </div>
                        
                        <div class="token-card">
                            <span class="token-number">${tokenAnalysis.javascript}</span>
                            <div class="token-label">JavaScript Files</div>
                        </div>
                        
                        <div class="token-card">
                            <span class="token-number">${tokenAnalysis.css}</span>
                            <div class="token-label">CSS Files</div>
                        </div>
                        
                        <div class="token-card">
                            <span class="token-number">${tokenAnalysis.json}</span>
                            <div class="token-label">JSON/Config Files</div>
                        </div>
                        
                        <div class="token-card">
                            <span class="token-number">${tokenAnalysis.text}</span>
                            <div class="token-label">Text/Markdown Files</div>
                        </div>
                        
                        <div class="token-card">
                            <span class="token-number">${tokenAnalysis.other}</span>
                            <div class="token-label">Other Assets</div>
                        </div>
                        
                        <div class="token-card">
                            <span class="token-number">${tokenAnalysis.lore}</span>
                            <div class="token-label">Lore/Context Data</div>
                        </div>
                        
                        <div class="token-card">
                            <span class="token-number">${tokenAnalysis.title + tokenAnalysis.description + tokenAnalysis.metadata}</span>
                            <div class="token-label">Metadata & Titles</div>
                        </div>
                        
                        <div class="token-card" style="grid-column: 1 / -1; background: #eff6ff; border-color: #bfdbfe;">
                            <span class="token-number" style="color: #1d4ed8;">${tokenAnalysis.total}</span>
                            <div class="token-label" style="color: #1e40af; font-weight: 600;">Total Estimated Tokens</div>
                        </div>
                    </div>
                    
                    ${assetBreakdownHtml}
                    
                    ${site?.prompt ? `
                        <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
                            <h3 style="margin: 0 0 12px 0; font-size: 1.2rem; color: #374151;">Original Prompt (${tokenAnalysis.prompt} tokens)</h3>
                            <div style="background: #f9fafb; padding: 16px; border-radius: 8px; border: 1px solid #e5e7eb; font-family: 'Space Mono', monospace; font-size: 0.9rem; white-space: pre-wrap; max-height: 300px; overflow-y: auto;">${site.prompt.text}</div>
                        </div>
                    ` : ''}
                    
                    <div style="margin-top: 20px; padding: 16px; background: #f0f9ff; border-radius: 8px; border: 1px solid #bae6fd; font-size: 0.9rem; color: #0c4a6e;">
                        <strong>Token Calculation Method:</strong> Uses word-based counting with different multipliers for code vs text content. Includes asset metadata, lore/context data, and project metadata that may be sent to AI models during generation.
                    </div>
                </div>
            `;
        }
        
        function showLoading() {
            document.getElementById('results').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    Analyzing project...
                </div>
            `;
        }
        
        function showError(message) {
            document.getElementById('results').innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${message}
                </div>
            `;
        }
        
        // Auto-fill if current project is available
        window.addEventListener('load', async () => {
            try {
                const currentProject = await window.websim?.getCurrentProject?.();
                if (currentProject?.id) {
                    document.getElementById('projectId').value = currentProject.id;
                }
            } catch (e) {
                // Ignore if websim API not available
            }
        });
    </script>
